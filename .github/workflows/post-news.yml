yaml
name: Post News to Instagram

on:
  schedule:
    # 한국시간 08~22시, 2시간마다 (하루 8번). cron은 UTC 기준
    - cron: "0 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: config.py 생성 (Secrets에서 값 주입)
        run: |
          cat > config.py << EOF
          RSS_FEED_URL = "${{ secrets.RSS_FEED_URL }}"
          SOURCE_NAME = "${{ secrets.SOURCE_NAME }}"
          IG_USER_ID = "${{ secrets.IG_USER_ID }}"
          IG_ACCESS_TOKEN = "${{ secrets.IG_ACCESS_TOKEN }}"
          CLOUDINARY_CLOUD_NAME = "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          CLOUDINARY_UPLOAD_PRESET = "${{ secrets.CLOUDINARY_UPLOAD_PRESET }}"
          PEXELS_API_KEY = "${{ secrets.PEXELS_API_KEY }}"
          UNSPLASH_ACCESS_KEY = "${{ secrets.UNSPLASH_ACCESS_KEY }}"
          INSTAGRAM_HANDLE = "${{ secrets.INSTAGRAM_HANDLE }}"
          BRAND_NAME = "${{ secrets.BRAND_NAME }}"
          CTA_TAGLINE = "${{ secrets.CTA_TAGLINE }}"
          TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
          PENDING_PHOTO_TIMEOUT_MINUTES = 360
          AUTO_STORY = ${{ secrets.AUTO_STORY == 'true' && 'True' || 'False' }}
          FIRST_COMMENT = "${{ secrets.FIRST_COMMENT }}"
          RSS_FEED_URLS = [u for u in """${{ secrets.RSS_FEED_URLS }}""".split() if u]
          EOF

      - name: 파이프라인 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: 상태 파일 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f posted_history.json pending_photo.json telegram_state.json 2>/dev/null || true
          git commit -m "chore: update bot state" || echo "변경사항 없음"
          git push

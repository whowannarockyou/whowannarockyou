<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Instagram OAuth 콜백</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
  code { background: #f4f4f4; padding: 12px; display: block; word-break: break-all; border-radius: 6px; }
  .warn { color: #b91c1c; margin-top: 20px; }
</style>
</head>
<body>
  <h2>Instagram 로그인 콜백</h2>
  <p>아래 code 값을 복사해서 <code>get_access_token.py</code> 실행 시 입력하세요.</p>
  <code id="code-box">code 파라미터를 찾는 중...</code>
  <p class="warn" id="error-box"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");

    if (code) {
      // Instagram 비즈니스 로그인의 code는 끝에 '#_' 가 붙어오는 경우가 있어 제거
      document.getElementById("code-box").textContent = code.replace(/#_$/, "");
    } else if (error) {
      document.getElementById("error-box").textContent =
        "에러 발생: " + error + " / " + (params.get("error_description") || "");
    } else {
      document.getElementById("code-box").textContent = "code 파라미터가 URL에 없습니다.";
    }
  </script>
</body>
</html>
